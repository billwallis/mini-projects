# yaml-language-server: $schema=https://json.schemastore.org/pyproject.json
[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-projects"
version = "0.0.0"
description = "All-in-one repo for mini projects."
authors = [{name = "billwallis"}]
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dynamic = ["dependencies"]

[dependency-groups]
dev = [
    "poethepoet>=0.46.0",
    "pre-commit>=4.6.0",
]
test = [
    "covdefaults>=2.3.0",
    "coverage>=7.13.5",
    "pytest>=9.0.3",
]


# For some reason, setuptools doesn't like the editable syntax :sob:
#[tool.setuptools.dynamic]
#dependencies = {file = ["requirements.txt"]}


[tool.poe]
verbosity = -1
envfile.optional = ".env"

[tool.poe.tasks]
install.shell = """
    pip install --editable . --requirement requirements.txt
    pip install --editable . --group dev --group test
    pre-commit install --install-hooks
"""
test.shell = """
    coverage run -m pytest -vvv
    coverage xml --quiet
    coverage report --no-skip-covered --include 'projects/*/tests/*'
    coverage report --no-skip-covered --include 'projects/*/src/*'
"""
add.shell = """
    python -m tools.add ${name}
"""
add.args = [
    {name = "name", positional = true, required = true},
]

[tool.poe.tasks.lint]
control.expr = "sys.platform"

[[tool.poe.tasks.lint.switch]]
case = "win32"
shell = """
    echo '=== pre-commit checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '=== pre-push checks ==='
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""

[[tool.poe.tasks.lint.switch]]
shell = """
    echo '\\033[0;34mpre-commit checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-commit
    echo '\\033[0;34mpre-push checks\\033[0m'
    SKIP=identity pre-commit run --all-files --hook-stage pre-push
"""


[tool.pytest.ini_options]
testpaths = ["projects/*/tests"]

[tool.coverage]
run.source = [
    "projects/ackermann_function/src/",
    "projects/ackermann_function/tests/",
    "projects/base_64_encoding/src/",
    "projects/base_64_encoding/tests/",
    "projects/binary_and_trinary/src/",
    "projects/binary_and_trinary/tests/",
    "projects/character_encoding/src/",
    "projects/character_encoding/tests/",
    "projects/character_replacer/src/",
    "projects/character_replacer/tests/",
    "projects/collatz/src/",
    "projects/collatz/tests/",
    "projects/cycle_generator/src/",
    "projects/cycle_generator/tests/",
    "projects/memoisation/src/",
    "projects/memoisation/tests/",
    "projects/morse_code_translator/src/",
    "projects/morse_code_translator/tests/",
]
run.plugins = ["covdefaults"]  # https://youtu.be/70T6OxKwxm0
report.fail_under = 10
report.exclude_lines = [
    "@pytest.mark.skip",
    "@pytest.mark.xfail",
]
